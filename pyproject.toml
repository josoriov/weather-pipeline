[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Weather ingestion pipeline with AWS Lambda, S3, Glue, and Athena"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2.0",
]

[dependency-groups]
dev = [
  "mypy>=1.10,<2.0",
  "pyarrow==23.0.1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
files = ["lambda/app.py", "tests/test_app.py"]
ignore_missing_imports = true
